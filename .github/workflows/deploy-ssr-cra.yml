name: Deploy SSR-CRA Ω-1.0 to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'OmniArchitect_SSR_CRA_Omega-1.0-Sovereign/**'
      - '.github/workflows/deploy-ssr-cra.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload SSR-CRA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './OmniArchitect_SSR_CRA_Omega-1.0-Sovereign'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
